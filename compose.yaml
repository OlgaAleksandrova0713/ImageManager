services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
          - ./images:/app/images
          - ./logs:/app/logs

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./images:/images:ro
      - ./static:/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app


